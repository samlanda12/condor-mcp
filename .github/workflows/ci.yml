name: ci

on:
    push:
        branches: [ main ]
    pull_request:

permissions:
    contents: read

# A new push to a PR cancels that PR's older run
# Runs on main always finish
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        runs-on: ubuntu-latest
        # The tests submit to a live pool, so run inside the HTCondor mini image
        container: htcondor/mini:25.13.2-el9
        timeout-minutes: 20
        # Skip log warnings
        env:
            UV_LINK_MODE: copy
        steps:
            - name: checkout the repo
              uses: actions/checkout@v5

            - name: start the pool
              run: |
                  /start.sh > /tmp/start.log 2>&1 &
                  condor_who -quick -wait:120 'IsReady && STARTD_State =?= "Ready"'

            - name: install uv
              id: uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  enable-cache: false

            # The schedd refuses submissions from root, so test as submituser
            - name: run tests
              run: |
                  chown -R submituser .
                  runuser -u submituser -- env HOME=/home/submituser "${{ steps.uv.outputs.uv-path }}" run --locked pytest

    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: checkout the repo
              uses: actions/checkout@v5

            - name: install uv
              uses: astral-sh/setup-uv@v10.3.3

            - name: run mypy
              run: uv run --locked mypy condor_mcp tests

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: checkout the repo
              uses: actions/checkout@v5

            - name: install uv
              uses: astral-sh/setup-uv@v10.3.3

            # Annotates the PR diff with each finding
            - name: run ruff check
              id: check
              run: uv run --locked --only-dev ruff check --output-format github

            - name: run ruff format
              if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
              run: uv run --locked --only-dev ruff format --check
